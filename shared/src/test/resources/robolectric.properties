# Robolectric 4.17's ConscryptMode inserts the bundled Conscrypt provider at
# java.security.Security position 1 for every sandboxed test. The JDK's
# javax.crypto.JarVerifier clinit then parses/verifies the JCE framework test
# certificate with Conscrypt's X509 implementation, whose BoringSSL build
# rejects the algorithm ("DIGEST_AND_KEY_TYPE_NOT_SUPPORTED"). The failed
# clinit poisons javax.crypto.JarVerifier for the whole test JVM, so every
# later Cipher.getInstance throws NoClassDefFoundError — breaking
# AirPlayCryptoChachaTest / AirPlayCryptoAndroidCompatibilityTest whenever any
# Robolectric test ran first in the same worker. Keep the JDK provider order.
conscryptMode=OFF
